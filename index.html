<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>奶蛙漫游 · 阳光逃跑计划</title><link rel="stylesheet" href="style.css"></head><body>
<div id="app"><canvas id="canvas"></canvas><div class="shade"></div><header><button id="homeButton">奶蛙漫游 <small>FROG VOYAGE</small></button><div><span id="wallet">0 金币</span><button id="sound">声音：关</button></div></header>
<section id="home" class="screen"><div class="headline"><span>SUNSHINE RUNNER / 01</span><h1>奶蛙<span>快出发。</span></h1><p>带上小小勇气，跑进大大世界。</p></div><div class="quick"><button data-panel="maps">世界地图 <b>3</b></button><button data-panel="guide">障碍图鉴 <b>6</b></button><button data-panel="missions">成长挑战 <b>6</b></button></div><div class="home-bottom"><button class="outfit" data-panel="shop"><span id="outfitName">经典奶蛙</span><small>去换装 →</small></button><button class="map-choice" data-panel="maps"><span id="mapName">金沙秘境</span><small>自由选图 · 无限奔跑 →</small></button><button id="start" class="primary">点击开跑 <span>▶</span></button><div class="difficulty"><button data-difficulty="easy">简单</button><button data-difficulty="normal" class="selected">普通</button><button data-difficulty="hard">困难</button></div><nav><button data-panel="shop">换装</button><button data-panel="records">纪录</button><button data-panel="missions">任务</button><button data-panel="settings">设置</button></nav></div></section>
<section id="hud" hidden><div class="run-stats"><div><small>奔跑距离</small><b id="distance">0</b><span>米</span></div><div><small>本局金币</small><b id="coins">0</b></div><button id="pause">Ⅱ</button></div><div id="effects"></div><div id="danger">阳光正好，尽情奔跑</div><div class="controls"><button data-action="left">←</button><button data-action="jump">跳跃 ↑</button><button data-action="slide">滑铲 ↓</button><button data-action="right">→</button></div></section>
<div id="panel" class="panel" hidden><div class="panel-card"><div class="panel-top"><h2 id="panelTitle"></h2><button id="closePanel">×</button></div><div id="panelContent"></div></div></div><div id="result" class="panel" hidden><div class="panel-card result-card"><span class="eyebrow">ONE MORE LITTLE ADVENTURE</span><h2 id="resultTitle">被牛牛逮住啦</h2><p id="resultText"></p><button id="retry" class="primary">再跑一次 →</button><button id="returnHome">返回车站</button></div></div><div id="toast"></div><div id="loading">正在布置奶蛙的阳光世界…</div></div>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.min.js"></script><script src="game.js"></script></body></html>
